<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Do You Love Me?</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: black;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
    touch-action: none;
}

.background {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: #FFCC99;
    z-index: 0;
    display: none;
}

.background img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
}

.box {
    position: relative;
    z-index: 2;
    width: 100%;
    margin-top: 28vh;
    padding: 0 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

h1 {
    font-size: clamp(25px, 8vw, 36px);
    margin: 0 0 28px 0;
    text-shadow: 2px 2px 4px black;
    white-space: nowrap;
}

.emoji {
    width: 32px;
    height: 32px;
    object-fit: contain;
    vertical-align: middle;
}

.buttons {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 15px;
    width: 100%;
}

button {
    border: none;
    border-radius: 12px;
    padding: 14px 25px;
    min-width: 120px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
}

#yes {
    background: red;
    color: white;
}

#no {
    background: white;
    color: black;
    z-index: 3;
}

#no.moving {
    position: fixed;
}

#sad {
    position: fixed;
    left: 50%;
    top: 62%;
    transform: translate(-50%, -50%);
    width: 280px;
    height: 280px;
    display: none;
    z-index: 5;
    pointer-events: none;
}

#sad img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    z-index: 1;
    pointer-events: auto;
    touch-action: none;
}

@media (max-width: 600px) {

    .box {
        margin-top: 25vh;
    }

    h1 {
        font-size: 25px;
        margin-bottom: 25px;
    }

    .buttons {
        gap: 10px;
    }

    button {
        min-width: 105px;
        padding: 13px 18px;
        font-size: 16px;
    }

    #sad {
        width: 70vw;
        height: 70vw;
        max-width: 300px;
        max-height: 300px;
    }

    .emoji {
        width: 28px;
        height: 28px;
    }

}

</style>

</head>

<body>


<div class="background" id="background">

    <img src="gif.gif">

</div>


<div class="box">

    <h1 id="question">

        Do you love me?
        
        <img
            class="emoji"
            src="https://static.xx.fbcdn.net/images/emoji.php/v9/t55/1/32/1f97a.png"
        >

    </h1>


    <div class="buttons">

        <button id="yes">
            YES
        </button>

        <button id="no">
            NO
        </button>

    </div>

</div>


<div id="sad">

    <img id="sadImage" src="">

</div>


<canvas id="canvas"></canvas>


<script>

const yes = document.getElementById("yes");

const no = document.getElementById("no");

const question = document.getElementById("question");

const background = document.getElementById("background");

const sad = document.getElementById("sad");

const sadImage = document.getElementById("sadImage");

const canvas = document.getElementById("canvas");

const ctx = canvas.getContext("2d");


let hearts = [];

let raining = false;

let draggedHeart = null;

let dragOffsetX = 0;

let dragOffsetY = 0;

let lastPointerX = 0;

let lastPointerY = 0;

let swipeX = 0;

let swipeY = 0;


function resizeCanvas() {

    canvas.width = window.innerWidth;

    canvas.height = window.innerHeight;

}


resizeCanvas();


let sadFaces = [

    "https://static.xx.fbcdn.net/images/emoji.php/v9/t55/1/32/1f97a.png",

    "https://static.xx.fbcdn.net/images/emoji.php/v9/tfa/1/32/1f62d.png",

    "https://static.xx.fbcdn.net/images/emoji.php/v9/t2b/1/32/1f614.png",

    "https://static.xx.fbcdn.net/images/emoji.php/v9/tdc/1/32/1f61e.png",

    "https://static.xx.fbcdn.net/images/emoji.php/v9/t85/1/32/1f641.png",

    "https://static.xx.fbcdn.net/images/emoji.php/v9/td9/1/32/2639.png",

    "https://static.xx.fbcdn.net/images/emoji.php/v9/t4f/1/32/1f629.png",

    "https://static.xx.fbcdn.net/images/emoji.php/v9/t5d/1/32/1f61f.png",

    "https://static.xx.fbcdn.net/images/emoji.php/v9/tac/1/32/1f615.png",

    "https://static.xx.fbcdn.net/images/emoji.php/v9/t49/1/32/1f623.png",

    "https://static.xx.fbcdn.net/images/emoji.php/v9/t2d/1/32/1f616.png",

    "https://static.xx.fbcdn.net/images/emoji.php/v9/tf8/1/32/1f62b.png",

    "https://static.xx.fbcdn.net/images/emoji.php/v9/tc8/1/32/1f622.png",

    "https://static.xx.fbcdn.net/images/emoji.php/v9/t65/1/32/1f630.png",

    "https://static.xx.fbcdn.net/images/emoji.php/v9/t4b/1/32/1f625.png",

    "https://static.xx.fbcdn.net/images/emoji.php/v9/tce/1/32/1f628.png",

    "https://static.xx.fbcdn.net/images/emoji.php/v9/taa/1/32/1f613.png"

];


function moveNo() {

    no.classList.add("moving");

    let padding = 15;

    let maxX =
        window.innerWidth -
        no.offsetWidth -
        padding;

    let maxY =
        window.innerHeight -
        no.offsetHeight -
        padding;

    let x =
        padding +
        Math.random() *
        Math.max(0, maxX - padding);

    let y =
        padding +
        Math.random() *
        Math.max(0, maxY - padding);

    no.style.left = x + "px";

    no.style.top = y + "px";


    let face =
        sadFaces[
            Math.floor(
                Math.random() *
                sadFaces.length
            )
        ];


    sadImage.src = face;

    sad.style.display = "block";


    setTimeout(function() {

        sad.style.display = "none";

    }, 1200);

}


no.addEventListener("pointerdown", function(event) {

    event.preventDefault();

    moveNo();

});


yes.addEventListener("pointerdown", function(event) {

    event.preventDefault();

    startLove();

});


function startLove() {

    if (raining) {
        return;
    }


    raining = true;


    background.style.display = "block";


    question.innerHTML =
        'I knew it! ' +

        '<img class="emoji" src="' +
        'https://static.xx.fbcdn.net/images/emoji.php/v9/t72/1/32/2764.png' +
        '">' +

        '<img class="emoji" src="' +
        'https://static.xx.fbcdn.net/images/emoji.php/v9/t2f/1/32/1f618.png' +
        '">';


    yes.style.display = "none";

    no.style.display = "none";


    hearts = [];


    for (let i = 0; i < 70; i++) {

        hearts.push({

            x:
                Math.random() *
                canvas.width,

            y:
                Math.random() *
                -canvas.height,

            size:
                18 +
                Math.random() * 14,

            speed:
                1 +
                Math.random() * 2.5,

            rotation:
                Math.random() *
                Math.PI *
                2,

            rotationSpeed:
                (Math.random() - 0.5) *
                0.04,

            vx: 0,

            vy: 0,

            dragging: false

        });

    }

}


function drawHeart(
    x,
    y,
    size,
    rotation
) {

    ctx.save();

    ctx.translate(x, y);

    ctx.rotate(rotation);

    ctx.beginPath();

    ctx.moveTo(
        0,
        size * 0.45
    );

    ctx.bezierCurveTo(
        -size * 0.9,
        -size * 0.15,
        -size * 0.6,
        -size * 0.9,
        0,
        -size * 0.35
    );

    ctx.bezierCurveTo(
        size * 0.6,
        -size * 0.9,
        size * 0.9,
        -size * 0.15,
        0,
        size * 0.45
    );

    ctx.fillStyle = "red";

    ctx.fill();

    ctx.restore();

}


function getPointerPosition(event) {

    const rect =
        canvas.getBoundingClientRect();

    return {

        x:
            event.clientX -
            rect.left,

        y:
            event.clientY -
            rect.top

    };

}


canvas.addEventListener(
    "pointerdown",
    function(event) {

        if (!raining) {
            return;
        }


        const pointer =
            getPointerPosition(event);


        for (
            let i = hearts.length - 1;
            i >= 0;
            i--
        ) {

            const heart =
                hearts[i];


            const distance =
                Math.sqrt(

                    Math.pow(
                        pointer.x -
                        heart.x,
                        2
                    )

                    +

                    Math.pow(
                        pointer.y -
                        heart.y,
                        2
                    )

                );


            if (
                distance <
                heart.size * 1.5
            ) {

                draggedHeart =
                    heart;


                dragOffsetX =
                    pointer.x -
                    heart.x;


                dragOffsetY =
                    pointer.y -
                    heart.y;


                lastPointerX =
                    pointer.x;


                lastPointerY =
                    pointer.y;


                swipeX = 0;

                swipeY = 0;


                heart.dragging =
                    true;


                canvas.setPointerCapture(
                    event.pointerId
                );


                break;

            }

        }

    }
);


canvas.addEventListener(
    "pointermove",
    function(event) {

        if (!draggedHeart) {
            return;
        }


        const pointer =
            getPointerPosition(event);


        swipeX =
            pointer.x -
            lastPointerX;


        swipeY =
            pointer.y -
            lastPointerY;


        draggedHeart.x =
            pointer.x -
            dragOffsetX;


        draggedHeart.y =
            pointer.y -
            dragOffsetY;


        lastPointerX =
            pointer.x;


        lastPointerY =
            pointer.y;


        repelNearbyHearts();

    }
);


function repelNearbyHearts() {

    for (
        let heart of hearts
    ) {

        if (
            heart ===
            draggedHeart
        ) {
            continue;
        }


        let dx =
            heart.x -
            draggedHeart.x;


        let dy =
            heart.y -
            draggedHeart.y;


        let distance =
            Math.sqrt(
                dx * dx +
                dy * dy
            );


        let touchingDistance =
            heart.size +
            draggedHeart.size +
            20;


        if (
            distance <
            touchingDistance
        ) {

            if (distance < 1) {
                distance = 1;
            }


            let push =
                (
                    touchingDistance -
                    distance
                ) / touchingDistance;


            let directionX =
                dx / distance;


            let directionY =
                dy / distance;


            heart.vx +=
                directionX *
                push *
                8;


            heart.vy +=
                directionY *
                push *
                8;


            heart.vx +=
                swipeX *
                push *
                1.5;


            heart.vy +=
                swipeY *
                push *
                1.5;


            heart.x +=
                directionX *
                push *
                5;


            heart.y +=
                directionY *
                push *
                5;

        }

    }

}


canvas.addEventListener(
    "pointerup",
    function(event) {

        if (draggedHeart) {

            draggedHeart.dragging =
                false;


            draggedHeart.vx =
                swipeX * 1.8;


            draggedHeart.vy =
                swipeY * 1.8;


            draggedHeart =
                null;

        }


        if (
            canvas.hasPointerCapture(
                event.pointerId
            )
        ) {

            canvas.releasePointerCapture(
                event.pointerId
            );

        }

    }
);


canvas.addEventListener(
    "pointercancel",
    function(event) {

        if (draggedHeart) {

            draggedHeart.dragging =
                false;


            draggedHeart =
                null;

        }


        if (
            canvas.hasPointerCapture(
                event.pointerId
            )
        ) {

            canvas.releasePointerCapture(
                event.pointerId
            );

        }

    }
);


function animate() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    if (raining) {

        for (
            let heart of hearts
        ) {

            if (
                !heart.dragging
            ) {

                heart.y +=
                    heart.speed;


                heart.x +=
                    heart.vx;


                heart.y +=
                    heart.vy;


                heart.vx *=
                    0.94;


                heart.vy *=
                    0.94;


                heart.rotation +=
                    heart.rotationSpeed;

            }


            drawHeart(

                heart.x,

                heart.y,

                heart.size,

                heart.rotation

            );


            if (
                heart.y >
                canvas.height + 50
            ) {

                heart.y = -50;


                heart.x =
                    Math.random() *
                    canvas.width;


                heart.vx = 0;

                heart.vy = 0;

            }


            if (
                heart.x <
                -50
            ) {

                heart.x =
                    canvas.width + 50;

            }


            if (
                heart.x >
                canvas.width + 50
            ) {

                heart.x = -50;

            }

        }

    }


    requestAnimationFrame(
        animate
    );

}


animate();


window.addEventListener(
    "resize",
    function() {

        resizeCanvas();

    }
);

</script>

</body>
</html>
